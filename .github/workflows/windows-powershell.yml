name: Windows PowerShell 5.1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows-ps51:
    name: validate-windows-ps51
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Windows PowerShell version
        shell: powershell
        run: $PSVersionTable

      - name: Validate PowerShell syntax
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Validate-PowerShell.ps1

      - name: Test invariants
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Test-Invariants.ps1

      - name: Test control logic and process identity
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Test-Control-Logic.ps1

      - name: Build release
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\Build-Release.ps1 -OutputDirectory .\artifacts

      - name: Verify release archive
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Test-Release.ps1 -OutputDirectory .\artifacts

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: casa-elida-anuncios
          path: artifacts/*.zip
          if-no-files-found: error
